name: 构建 LEDE / ImmortalWrt 固件

on:
  workflow_dispatch:
    inputs:
      source:
        description: '选择编译源码（lede 或 immortalwrt）'
        required: true
        default: 'lede'
        type: choice
        options:
          - lede
          - immortalwrt
      lan_ip:
        description: '自定义后台 LAN IP（例如 192.168.5.1 或 10.0.0.1）'
        required: false
        default: '10.0.0.1'
      config_url:
        description: '自定义 .config 地址（或 diy.sh 远程地址，以 .sh 结尾优先当作 diy 脚本执行）'
        required: false
        default: ''

env:
  TZ: Asia/Shanghai
  REMOTE_CONFIG_URL: "https://raw.githubusercontent.com/xiaojing110/openwrt-TD/main/X86/.config"
  LAN_IP: ${{ github.event.inputs.lan_ip || '10.0.0.1' }}
  SOURCE: ${{ github.event.inputs.source || 'lede' }}
  CONFIG_URL: ${{ github.event.inputs.config_url || '' }}
  BUILD_AUTHOR: ${{ github.repository_owner }}   # 默认使用仓库拥有者用户名

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: 设置时区
        run: sudo timedatectl set-timezone "${TZ}"

      - name: 安装编译依赖
        run: |
          sudo apt update -y && sudo apt full-upgrade -y
          sudo apt install -y build-essential clang flex bison gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl subversion vim
          sudo apt clean

      - name: 最大化构建空间
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 2048

      - name: 克隆源码
        run: |
          if [ "${{ env.SOURCE }}" = "immortalwrt" ]; then
            git clone --depth=1 https://github.com/immortalwrt/immortalwrt.git lede
          else
            git clone --depth=1 https://github.com/coolsnowwolf/lede.git lede
          fi

      - name: 更新 feeds
        working-directory: ./lede
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 执行 diy（支持远程 .sh 或本地 diy.sh）
        run: |
          cd lede
          DIY_EXECUTED=false
          if [[ "${{ env.CONFIG_URL }}" == *.sh ]] && [[ -n "${{ env.CONFIG_URL }}" ]]; then
            echo "执行远程 diy 脚本"
            wget -O diy.sh "${{ env.CONFIG_URL }}" || exit 1
            chmod +x diy.sh
            bash diy.sh
            DIY_EXECUTED=true
            rm -f diy.sh
          fi
          if [ "$DIY_EXECUTED" = "false" ] && [ -f "../diy.sh" ]; then
            echo "执行本地 diy.sh"
            cp ../diy.sh .
            chmod +x diy.sh
            bash diy.sh
            DIY_EXECUTED=true
          fi
          echo "diy 执行状态: $DIY_EXECUTED"

      - name: 加载 .config
        working-directory: ./lede
        run: |
          if [[ "${{ env.CONFIG_URL }}" != *.sh ]] && [ -n "${{ env.CONFIG_URL }}" ]; then
            wget -O .config "${{ env.CONFIG_URL }}" || exit 1
          elif [ -f "../.config" ]; then
            cp ../.config .config
          elif [ -f "../X86/.config" ]; then
            cp ../X86/.config .config
          else
            wget -O .config "${{ env.REMOTE_CONFIG_URL }}" || exit 1
          fi
          make defconfig

      - name: 替换最新 luci-app-passwall
        working-directory: ./lede/feeds/luci/applications
        run: |
          rm -rf luci-app-passwall 2>/dev/null || true
          git clone --depth=1 https://github.com/xiaorouji/openwrt-passwall.git temp-passwall
          mv temp-passwall/luci-app-passwall .
          rm -rf temp-passwall

      - name: 修改 LAN IP & 主题
        working-directory: ./lede
        run: |
          sed -i "s/192.168.1.1/${{ env.LAN_IP }}/g" package/base-files/files/bin/config_generate
          PREFIX=$(echo "${{ env.LAN_IP }}" | cut -d. -f1-3)
          sed -i "s/192.168.1./${PREFIX}./g" package/base-files/files/bin/config_generate

          # 强制 argon 主题（如果有多个主题集合）
          find feeds/luci/ -type f -name Makefile -exec sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' {} \;
          find feeds/luci/ -type f -name Makefile -exec sed -i 's/luci-theme-material/luci-theme-argon/g' {} \;

      - name: 编译固件
        working-directory: ./lede
        env:
          FORCE_UNSAFE_CONFIGURE: 1
        run: |
          make download -j$(nproc) || make download -j1 V=s
          make -j$(nproc) V=s || make -j1 V=s

      - name: 生成固件说明文件（包含编译完成时间）
        working-directory: ./lede
        run: |
          TARGET_DIR=$(find bin/targets -mindepth 2 -maxdepth 3 -type d 2>/dev/null | head -n1)
          [ -z "$TARGET_DIR" ] && TARGET_DIR="bin/targets/x86/64" && mkdir -p "$TARGET_DIR"

          cat > "$TARGET_DIR/固件说明.txt" << 'EOF'
          ==================== 固件信息 ====================
          固件来源     : ${{ env.SOURCE }}
          编译完成时间 : $(date '+%Y-%m-%d %H:%M:%S %Z')  (Asia/Shanghai)
          后台地址     : http://${{ env.LAN_IP }}
          用户/密码    : root / password
          作者/维护者   : ${{ env.BUILD_AUTHOR }}
          config 来源   : ${{ env.CONFIG_URL || env.REMOTE_CONFIG_URL }}
          diy 执行     : ${{ (env.CONFIG_URL != '' && contains(env.CONFIG_URL, '.sh')) && '远程 diy.sh' || (github.event.inputs.config_url == '' && '本地 diy.sh（若存在）') || '无 diy 执行' }}
          Passwall 来源 : 最新 xiaorouji/openwrt-passwall
          ================================================
          EOF

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.SOURCE }}-${{ github.run_number }}
          path: lede/bin/targets/**/*
          retention-days: 14

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.SOURCE }}-${{ github.run_number }}
          name: ${{ env.SOURCE }}固件 - ${{ env.LAN_IP }} - ${{ github.run_number }}
          body: |
            ### 固件构建信息

            - **固件来源**： ${{ env.SOURCE }}
            - **LAN IP**： ${{ env.LAN_IP }}
            - **编译完成时间**： $(date '+%Y-%m-%d %H:%M:%S %Z') （Asia/Shanghai）
            - **作者/维护者**： ${{ env.BUILD_AUTHOR }}
            - **配置文件来源**：
              - 用户输入： ${{ env.CONFIG_URL || '未提供，使用默认' }}
              - 默认远程： ${{ env.REMOTE_CONFIG_URL }}
            - **diy 支持**： 支持远程 .sh 脚本 或 本地 diy.sh（feeds update 后、passwall 替换后执行）
            - **Passwall**： 使用最新版 xiaorouji/openwrt-passwall
            - **说明文件**： 已包含在固件目录中（固件说明.txt）

            固件下载路径见下方 Assets
          files: lede/bin/targets/**/*
          draft: false
          prerelease: false
