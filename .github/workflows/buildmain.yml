name: 构建 LEDE / ImmortalWrt 固件

on:
  workflow_dispatch:
    inputs:
      source:
        description: '选择编译源码（lede 或 immortalwrt 或 mt798x-closed）'
        required: true
        default: 'lede'
        type: choice
        options:
          - lede
          - immortalwrt
          - mt798x-closed

      lan_ip:
        description: '自定义后台 LAN IP（例如 192.168.5.1 或 10.0.0.1）'
        required: false
        default: '10.0.0.1'

      hostname:
        description: '自定义主机名（留空 = 不修改，使用源码默认值）'
        required: false
        default: ''

      config_url:
        description: '自定义 .config 文件下载地址（优先级最高）'
        required: false
        default: ''

      diy_url:
        description: '远程 diy 脚本地址（.sh 文件，会在 feeds 更新后、passwall 替换前执行）'
        required: false
        default: ''

      enable_web_debug:
        description: '编译前开启 Web 远程调试（浏览器直接访问，无需 SSH）'
        required: true
        default: false
        type: boolean

env:
  TZ: Asia/Shanghai
  REMOTE_CONFIG_URL: "https://raw.githubusercontent.com/xiaojing110/openwrt-TD/main/X86/.config"
  LAN_IP: ${{ github.event.inputs.lan_ip || '10.0.0.1' }}
  HOSTNAME: ${{ github.event.inputs.hostname }}
  SOURCE: ${{ github.event.inputs.source || 'lede' }}
  CONFIG_URL: ${{ github.event.inputs.config_url || '' }}
  DIY_URL: ${{ github.event.inputs.diy_url || '' }}
  ENABLE_WEB_DEBUG: ${{ github.event.inputs.enable_web_debug || 'false' }}
  BUILD_AUTHOR: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: 显示调试信息
        run: |
          echo "当前分支: $(git branch --show-current || echo '未知')"
          ls -la
          find . -maxdepth 3 -type f \( -name ".config" -o -name "config.buildinfo" -o -name "diy.sh" \) || true

      - name: 设置时区
        run: sudo timedatectl set-timezone "${TZ}"

      - name: 安装编译依赖
        run: |
          sudo apt update -y && sudo apt full-upgrade -y
          sudo apt install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib \
            g++-multilib gettext genisoimage git gperf haveged help2man intltool \
            libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
            libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev ninja-build p7zip \
            p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools \
            qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zip
          sudo apt clean

      - name: 最大化构建空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: 克隆源码
        run: |
          if [ "${{ env.SOURCE }}" = "immortalwrt" ]; then
            git clone --depth=1 https://github.com/immortalwrt/immortalwrt.git source-dir
          elif [ "${{ env.SOURCE }}" = "mt798x-closed" ]; then
            echo "⚠️ 使用闭源优化版 (padavanonly/immortalwrt-mt798x-6.6)"
            git clone --depth=1 -b openwrt-24.10-6.6 https://github.com/padavanonly/immortalwrt-mt798x-6.6.git source-dir
          else
            git clone --depth=1 https://github.com/coolsnowwolf/lede.git source-dir
          fi

      - name: 确定源码目录真实名称
        run: |
          echo "REAL_DIR=source-dir" >> $GITHUB_ENV
          echo "源码目录: source-dir"
          ls -la source-dir

      - name: 修改 feeds.conf.default
        working-directory: ./source-dir
        run: |
          if [ "${{ env.SOURCE }}" = "lede" ]; then
            sed -i '/^src-git luci/c\src-git luci https://github.com/coolsnowwolf/luci.git;openwrt-25.12' feeds.conf.default || true
            echo "src-git kenzo https://github.com/kenzok8/openwrt-packages" >> feeds.conf.default || true
            echo "src-git small https://github.com/kenzok8/small" >> feeds.conf.default || true
          fi
          sed -i 's/^#src-git qmodem/src-git qmodem/' feeds.conf.default || true

      - name: 更新并安装 feeds
        working-directory: ./source-dir
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f

      - name: 执行 diy 脚本
        working-directory: ./source-dir
        run: |
          if [ -n "${{ env.DIY_URL }}" ]; then
            echo "执行远程 diy: ${{ env.DIY_URL }}"
            wget -O diy-temp.sh "${{ env.DIY_URL }}" && chmod +x diy-temp.sh && bash ./diy-temp.sh || echo "远程 diy 执行失败但继续"
            rm -f diy-temp.sh
          elif [ -f "../../diy.sh" ]; then
            echo "执行本地 diy.sh"
            cp ../../diy.sh . && chmod +x diy.sh && bash ./diy.sh || echo "本地 diy 执行失败但继续"
            rm -f diy.sh
          else
            echo "无 diy 脚本"
          fi

      - name: 加载 .config
        working-directory: ./source-dir
        run: |
          CONFIG_FOUND=false
          if [ -n "${{ env.CONFIG_URL }}" ]; then
            wget -O .config "${{ env.CONFIG_URL }}" && CONFIG_FOUND=true
          fi
          if [ "$CONFIG_FOUND" = false ] && [ -f "../../config.buildinfo" ]; then
            cp -fv "../../config.buildinfo" .config && CONFIG_FOUND=true
          fi
          if [ "$CONFIG_FOUND" = false ] && [ -f "../../.config" ]; then
            cp -fv "../../.config" .config && CONFIG_FOUND=true
          fi
          if [ "$CONFIG_FOUND" = false ] && [ -f "../../X86/.config" ]; then
            cp -fv "../../X86/.config" .config && CONFIG_FOUND=true
          fi
          if [ "$CONFIG_FOUND" = false ]; then
            wget -O .config "${{ env.REMOTE_CONFIG_URL }}"
          fi
          make defconfig

      # ====================== Web 远程调试（浏览器控制） ======================
      - name: 🌐 编译前开启 Web 远程调试（浏览器直接访问，无需 SSH）
        if: env.ENABLE_WEB_DEBUG == 'true'
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          connect-timeout-seconds: 3600
        continue-on-error: true

      # ====================== 后续编译流程 ======================
      - name: mt798x-closed 模式 - 替换 golang
        if: env.SOURCE == 'mt798x-closed'
        working-directory: ./source-dir
        run: |
          rm -rf feeds/packages/lang/golang || true
          git clone --depth=1 -b 1.26 https://github.com/kenzok8/golang.git feeds/packages/lang/golang || exit 1
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f

      - name: 应用自定义修改（LAN IP + 主机名 + 强制 Argon 主题）
        working-directory: ./source-dir
        run: |
          echo "设置 LAN IP 为 ${{ env.LAN_IP }}"
          sed -i "s/192.168.1.1/${{ env.LAN_IP }}/g" package/base-files/files/bin/config_generate
          PREFIX_3=$(echo "${{ env.LAN_IP }}" | cut -d. -f1-3).
          PREFIX_2=$(echo "${{ env.LAN_IP }}" | cut -d. -f1-2).
          sed -i "s/192.168.1./${PREFIX_3}/g" package/base-files/files/bin/config_generate
          sed -i "s/192.168./${PREFIX_2}/g" package/base-files/files/bin/config_generate

          HOSTNAME_TRIMMED=$(echo "${{ env.HOSTNAME }}" | xargs)
          if [ -n "$HOSTNAME_TRIMMED" ]; then
            echo "设置主机名 为 $HOSTNAME_TRIMMED"
            sed -i -E "s/(set system\.@system\[-1\]\.hostname=')[^']+'/\1$HOSTNAME_TRIMMED'/" package/base-files/files/bin/config_generate
            echo "HOSTNAME_USED=$HOSTNAME_TRIMMED" >> $GITHUB_ENV
          else
            echo "HOSTNAME_USED=源码默认" >> $GITHUB_ENV
          fi

          echo "强制使用 Argon 主题"
          find feeds/luci/collections/ -type f -name Makefile -exec sed -i -E 's/(luci-theme-)[a-zA-Z0-9_-]+/\1argon/g' {} \;

      - name: 缓存、下载依赖并编译固件
        working-directory: ./source-dir
        env:
          FORCE_UNSAFE_CONFIGURE: 1
        run: |
          make download -j$(nproc) || make download -j1 V=s
          make -j$(nproc) V=s || make -j1 V=s

      - name: 收集已选 luci-app 信息
        working-directory: ./source-dir
        run: |
          APPS=""
          make manifest 2>/dev/null | grep -o 'luci-app-[^[:space:]]*' | sort | uniq > /tmp/luci-apps.txt || true
          if [ -s /tmp/luci-apps.txt ]; then
            while read -r pkg; do APPS="$APPS- ${pkg} (已编译进固件)\n"; done < /tmp/luci-apps.txt
          else
            grep '^CONFIG_PACKAGE_luci-app' .config 2>/dev/null | grep '=y' | sed 's/CONFIG_PACKAGE_//' | sed 's/=y//' | sort | uniq > /tmp/luci-apps.txt || true
            while read -r pkg; do APPS="$APPS- ${pkg} (已启用)\n"; done < /tmp/luci-apps.txt
          fi
          [ -z "$APPS" ] && APPS="未检测到任何 luci-app 插件"
          echo "LUCI_APPS<<EOF" >> $GITHUB_ENV
          echo -e "$APPS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 提取目标信息
        working-directory: ./source-dir
        run: |
          TARGET_BOARD=$(grep '^CONFIG_TARGET_' .config | grep '=y' | head -1 | sed -n 's/CONFIG_TARGET_\([^=]*\)=y/\1/p' || echo "unknown")
          TARGET_SUB=$(grep '^CONFIG_TARGET_.*_.*=y' .config | grep -v '^CONFIG_TARGET_BOARD' | head -1 | cut -d_ -f4- | cut -d= -f1 || echo "")
          TARGET_FULL="${TARGET_BOARD}${TARGET_SUB:+-$TARGET_SUB}"
          TARGET_PROFILE=$(make info 2>/dev/null | grep '^Target Profile' | cut -d: -f2- | xargs || echo "$TARGET_FULL")
          echo "TARGET_PROFILE=$TARGET_PROFILE" >> $GITHUB_ENV
          echo "TARGET_FULL=$TARGET_FULL" >> $GITHUB_ENV

      - name: 生成固件说明文件
        working-directory: ./source-dir
        run: |
          TARGET_DIR=$(find bin/targets -mindepth 2 -maxdepth 3 -type d 2>/dev/null | head -n1)
          [ -z "$TARGET_DIR" ] && mkdir -p "bin/targets/x86/64" && TARGET_DIR="bin/targets/x86/64"
          cat > "$TARGET_DIR/固件说明.txt" << EOF
          ==================== 固件信息 ====================
          固件来源     : ${{ env.SOURCE }}
          目标设备     : ${{ env.TARGET_PROFILE }}
          编译时间     : $(date '+%Y-%m-%d %H:%M:%S %Z')
          后台地址     : http://${{ env.LAN_IP }}
          主机名       : ${{ env.HOSTNAME_USED }}
          ================================================
          EOF

      - name: 打包软件包并发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.SOURCE }}-${{ env.TARGET_PROFILE || 'unknown' }}-${{ github.run_number }}
          name: ${{ env.SOURCE }} • ${{ env.TARGET_PROFILE }} • LAN ${{ env.LAN_IP }} • #${{ github.run_number }}
          body: |
            Web 远程调试已 ${{ env.ENABLE_WEB_DEBUG == 'true' && '开启' || '关闭' }}
            ${{ env.LUCI_APPS }}
          files: |
            ./source-dir/bin/targets/**/*.img
            ./source-dir/bin/targets/**/*.bin
            ./source-dir/bin/targets/**/*.squashfs*
            ./source-dir/bin/targets/**/固件说明.txt
            ./source-dir/packages-*.zip
