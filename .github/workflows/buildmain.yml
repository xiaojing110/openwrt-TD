name: 构建 LEDE / ImmortalWrt 固件

on:
  workflow_dispatch:
    inputs:
      source:
        description: '选择编译源码（lede 或 immortalwrt 或 mt798x-closed）'
        required: true
        default: 'lede'
        type: choice
        options:
          - lede
          - immortalwrt
          - mt798x-closed
      lan_ip:
        description: '自定义后台 LAN IP（例如 192.168.5.1 或 10.0.0.1）'
        required: false
        default: '10.0.0.1'
      config_url:
        description: '自定义 .config 文件下载地址（优先级最高）'
        required: false
        default: ''
      diy_url:
        description: '远程 diy 脚本地址（.sh 文件，会在 feeds 更新后、passwall 替换前执行）'
        required: false
        default: ''

env:
  TZ: Asia/Shanghai
  REMOTE_CONFIG_URL: "https://raw.githubusercontent.com/xiaojing110/openwrt-TD/main/X86/.config"
  LAN_IP: ${{ github.event.inputs.lan_ip || '10.0.0.1' }}
  SOURCE: ${{ github.event.inputs.source || 'lede' }}
  CONFIG_URL: ${{ github.event.inputs.config_url || '' }}
  DIY_URL: ${{ github.event.inputs.diy_url || '' }}
  BUILD_AUTHOR: ${{ github.repository_owner }}
  SRC_DIR: lede   # 源码统一目录名，方便兼容不同 source

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: 显示调试信息
        run: |
          echo "当前分支: $(git branch --show-current || echo '未知')"
          ls -la
          find . -maxdepth 3 -type f \( -name ".config" -o -name "diy.sh" \) || true

      - name: 设置时区
        run: sudo timedatectl set-timezone "${TZ}"

      - name: 安装编译依赖
        run: |
          sudo apt update -y && sudo apt full-upgrade -y
          sudo apt install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib \
            g++-multilib gettext genisoimage git gperf haveged help2man intltool \
            libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
            libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev ninja-build p7zip \
            p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools \
            qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zip
          sudo apt clean

      - name: 最大化构建空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: 克隆源码
        run: |
          if [ "${{ env.SOURCE }}" = "immortalwrt" ]; then
            git clone --depth=1 https://github.com/immortalwrt/immortalwrt.git ${{ env.SRC_DIR }}
          elif [ "${{ env.SOURCE }}" = "mt798x-closed" ]; then
            echo "⚠️ 使用闭源优化版 (padavanonly/immortalwrt-mt798x-6.6) - 仅适合 MT798x 机型"
            git clone --depth=1 -b openwrt-24.10-6.6 https://github.com/padavanonly/immortalwrt-mt798x-6.6.git ${{ env.SRC_DIR }}
          else
            git clone --depth=1 https://github.com/coolsnowwolf/lede.git ${{ env.SRC_DIR }}
          fi

      - name: 修改 feeds.conf.default（仅 lede 使用 coolsnowwolf/luci openwrt-25.12 分支）
        working-directory: ./${{ env.SRC_DIR }}
        if: env.SOURCE == 'lede'
        run: |
          sed -i '/^src-git luci/c\src-git luci https://github.com/coolsnowwolf/luci.git;openwrt-25.12' feeds.conf.default || true

      - name: 修改 feeds.conf.default（通用部分：qmodem + mosdns）
        working-directory: ./${{ env.SRC_DIR }}
        run: |
          sed -i 's/^#src-git qmodem/src-git qmodem/' feeds.conf.default || true
          echo "src-git mosdns https://github.com/sbwml/luci-app-mosdns.git" >> feeds.conf.default || true

      - name: 更新并安装 feeds
        working-directory: ./${{ env.SRC_DIR }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f

      - name: 执行 diy 脚本（优先远程 diy_url，其次本地 diy.sh）
        run: |
          cd ${{ env.SRC_DIR }}
          DIY_STATUS="未执行"
          if [ -n "${{ env.DIY_URL }}" ]; then
            echo "执行远程 diy 脚本: ${{ env.DIY_URL }}"
            wget -O diy-temp.sh "${{ env.DIY_URL }}" || { echo "远程 diy 下载失败"; exit 1; }
            chmod +x diy-temp.sh
            bash ./diy-temp.sh && DIY_STATUS="远程 diy_url 执行成功" || DIY_STATUS="远程 diy 执行失败但继续"
            rm -f diy-temp.sh
          elif [ -f "../diy.sh" ]; then
            echo "执行本地 diy.sh"
            cp ../diy.sh .
            chmod +x diy.sh
            bash ./diy.sh && DIY_STATUS="本地 diy.sh 执行成功" || DIY_STATUS="本地 diy 执行失败但继续"
            rm -f diy.sh
          else
            DIY_STATUS="无 diy 脚本"
          fi
          echo "DIY 状态: $DIY_STATUS"

      - name: 替换 luci-app-passwall（sparse checkout）
        working-directory: ./${{ env.SRC_DIR }}
        run: |
          # 强制创建 applications 目录，避免目录不存在导致 bash 启动失败
          mkdir -p feeds/luci/applications

          PASSWALL_PATH="feeds/luci/applications/luci-app-passwall"

          rm -rf "$PASSWALL_PATH" 2>/dev/null || true

          git clone --depth=1 --single-branch \
            https://github.com/Openwrt-Passwall/openwrt-passwall.git temp-passwall || { echo "git clone 失败"; exit 1; }

          cd temp-passwall || exit 1
          git sparse-checkout init --cone
          git sparse-checkout set luci-app-passwall
          git checkout || { echo "git checkout 失败"; exit 1; }

          mv luci-app-passwall "../feeds/luci/applications/" || { echo "mv 失败"; exit 1; }
          cd ..
          rm -rf temp-passwall

          # 调试输出
          if [ -d "$PASSWALL_PATH" ]; then
            echo "passwall 替换成功：$PASSWALL_PATH 存在"
            ls -la "$PASSWALL_PATH"
          else
            echo "警告：$PASSWALL_PATH 替换后仍不存在"
            ls -la feeds/luci/applications
          fi

      - name: 加载 .config
        working-directory: ./${{ env.SRC_DIR }}
        run: |
          if [ -n "${{ env.CONFIG_URL }}" ]; then
            echo "下载用户指定的 .config: ${{ env.CONFIG_URL }}"
            wget -O .config "${{ env.CONFIG_URL }}" || exit 1
          elif [ "${{ env.SOURCE }}" = "mt798x-closed" ]; then
            echo "mt798x-closed 模式：使用默认 mt7981-ax3000 示例（可通过 config_url 覆盖）"
            if [ -f "defconfig/mt7981-ax3000.config" ]; then
              cp -f defconfig/mt7981-ax3000.config .config
            else
              wget -O .config "${{ env.REMOTE_CONFIG_URL }}" || exit 1
            fi
          elif [ -f "../.config" ]; then
            cp -fv "../.config" .config
          elif [ -f "../X86/.config" ]; then
            cp -fv "../X86/.config" .config
          else
            echo "使用默认远程 config"
            wget -O .config "${{ env.REMOTE_CONFIG_URL }}" || exit 1
          fi
          if [ ! -s .config ]; then
            echo "错误：.config 文件为空或下载失败"
            exit 1
          fi
          make defconfig

      - name: mt798x-closed 模式 - 替换 golang 到 1.26 分支并更新 feeds
        if: env.SOURCE == 'mt798x-closed'
        working-directory: ./${{ env.SRC_DIR }}
        run: |
          echo "替换 golang feed 为 kenzok8 1.26 版本"
          rm -rf feeds/packages/lang/golang || true
          git clone --depth=1 -b 1.26 https://github.com/kenzok8/golang.git feeds/packages/lang/golang || { echo "克隆 golang 1.26 失败"; exit 1; }
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f
          grep -E "PKG_VERSION|GO_VERSION" feeds/packages/lang/golang/golang/Makefile || echo "未找到 golang 版本信息"

      - name: 应用自定义修改（LAN IP + 强制 Argon 主题）
        working-directory: ./${{ env.SRC_DIR }}
        run: |
          sed -i "s/192.168.1.1/${{ env.LAN_IP }}/g" package/base-files/files/bin/config_generate
          PREFIX_3=$(echo "${{ env.LAN_IP }}" | cut -d. -f1-3).
          PREFIX_2=$(echo "${{ env.LAN_IP }}" | cut -d. -f1-2).
          sed -i "s/192.168.1./${PREFIX_3}/g" package/base-files/files/bin/config_generate
          sed -i "s/192.168./${PREFIX_2}/g" package/base-files/files/bin/config_generate
          find feeds/luci/collections/ -type f -name Makefile -exec \
            sed -i -E 's/(luci-theme-)[a-zA-Z0-9_-]+/\1argon/g' {} \;

      - name: 缓存下载文件和工具链
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SRC_DIR }}/dl
            ${{ env.SRC_DIR }}/staging_dir
          key: ${{ runner.os }}-lede-build-${{ hashFiles(format('{0}/.config', env.SRC_DIR)) }}
          restore-keys: ${{ runner.os }}-lede-build-

      - name: 下载依赖包
        working-directory: ./${{ env.SRC_DIR }}
        run: |
          make download -j$(nproc) || make download -j1 V=s

      - name: 编译固件
        working-directory: ./${{ env.SRC_DIR }}
        env:
          FORCE_UNSAFE_CONFIGURE: 1
        run: |
          make -j$(nproc) V=s || make -j1 V=s

      - name: 生成固件说明文件 + 提取机型与主要应用信息
        working-directory: ./${{ env.SRC_DIR }}
        run: |
          TARGET_DIR=$(find bin/targets -mindepth 2 -maxdepth 3 -type d 2>/dev/null | head -n1)
          [ -z "$TARGET_DIR" ] && mkdir -p "bin/targets/x86/64" && TARGET_DIR="bin/targets/x86/64"

          TARGET_PROFILE_LINE=$(grep -E '^CONFIG_TARGET_[a-z0-9]+_[a-z0-9]+=' .config | tail -n1)
          if [ -n "$TARGET_PROFILE_LINE" ]; then
            TARGET_PROFILE=$(echo "$TARGET_PROFILE_LINE" | cut -d= -f1 | cut -d_ -f4- | sed 's/_/-/g' | tr '[:upper:]' '[:lower:]')
          else
            TARGET_PROFILE="generic-or-unknown"
          fi

          TARGET_BOARD=$(grep '^CONFIG_TARGET_BOARD=' .config | cut -d'"' -f2 | head -n1 || echo "unknown")
          TARGET_SUBTARGET=$(grep '^CONFIG_TARGET_SUBTARGET=' .config | cut -d'"' -f2 | head -n1 || echo "unknown")

          DEVICE_INFO="${TARGET_BOARD}/${TARGET_SUBTARGET}/${TARGET_PROFILE}"
          [ "$DEVICE_INFO" = "unknown/unknown/generic-or-unknown" ] && DEVICE_INFO="未知设备（请检查 .config）"

          echo "" > apps.txt
          echo "已选中的主要 LuCI 应用（部分）：" >> apps.txt
          grep -E '^CONFIG_PACKAGE_luci-app-(passwall|openclash|zerotier|ddns|upnp|transmission|aria2|frpc|frps|ttyd|filebrowser|dockerman|mwan3|https-dns-proxy|mosdns|adguardhome|shadowsocks|simple-obfs|v2ray|xray|homeproxy|argon|fullcone|full|lite)=y' .config \
            | sed 's/^CONFIG_PACKAGE_luci-app-//; s/=y$//; s/^/  - /' \
            | sort -u \
            | head -n 30 >> apps.txt || echo "  （未检测到常见 luci-app）" >> apps.txt

          cat > "$TARGET_DIR/固件说明.txt" << EOF
          ==================== 固件信息 ====================
          固件来源     : ${{ env.SOURCE }} （mt798x-closed 为闭源优化版，仅限 MT798x 机型）
          目标设备     : $DEVICE_INFO
          编译完成时间 : $(date '+%Y-%m-%d %H:%M:%S %Z') (Asia/Shanghai)
          后台地址     : http://${{ env.LAN_IP }}
          用户名/密码  : root / password
          作者/维护者  : ${{ env.BUILD_AUTHOR }}
          config 来源  : ${{ env.CONFIG_URL || env.REMOTE_CONFIG_URL }}
          diy 来源     : ${{ env.DIY_URL || '本地 diy.sh（若存在）' || '无' }}
          
          $(cat apps.txt)
          ================================================
          EOF

          echo "DEVICE_INFO=$DEVICE_INFO" >> $GITHUB_ENV
          echo "RELEASE_TITLE=${{ env.SOURCE }} - $DEVICE_INFO - ${{ env.LAN_IP }} - #${{ github.run_number }}" >> $GITHUB_ENV

      - name: 打包 bin 目录为 zip（只包含 .ipk / .apk 等，排除固件镜像）
        working-directory: ./${{ env.SRC_DIR }}
        run: |
          ZIP_NAME="packages-ipk-apk-${{ env.SOURCE }}-${{ github.run_number }}.zip"
          cd bin
          zip -r -9 "../${ZIP_NAME}" . \
            -x "targets/*/*.img" \
            -x "targets/*/*.img.gz" \
            -x "targets/*/*.bin" \
            -x "targets/*/*.squashfs" \
            -x "targets/*/*.vdi" \
            -x "targets/*/*.vmdk" \
            -x "targets/*/*.ova" \
            -x "targets/*/*.gz" \
            -x "targets/*/*.xz" \
            -x "targets/*/*.tar.gz" \
            -x "targets/*/profiles.json" \
            -x "targets/*/sha256sums" \
            || true
          cd ..
          ls -lh "${ZIP_NAME}" || true
          unzip -l "${ZIP_NAME}" | head -n 20 || true

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.SOURCE }}-${{ github.run_number }}
          name: ${{ env.RELEASE_TITLE }}
          body: |
            ### 固件构建信息
            
            - **固件来源**： ${{ env.SOURCE }}  
              （若为 mt798x-closed，则为闭源优化版，仅适合 MT798x 机型）
            - **目标设备**： ${{ env.DEVICE_INFO }}
            - **LAN IP**： ${{ env.LAN_IP }}
            - **编译完成时间**： $(date '+%Y-%m-%d %H:%M:%S %Z') (Asia/Shanghai)
            - **作者/维护者**： ${{ env.BUILD_AUTHOR }}
            - **配置来源**： ${{ env.CONFIG_URL || '默认远程 config' }}
            - **diy 脚本**： ${{ env.DIY_URL || '本地 diy.sh（若存在）' || '无' }}
            
            **已启用主要 LuCI 应用（部分，来自 .config 提取）**：
